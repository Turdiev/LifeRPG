# tech-spec, «CI/CD»: на каждый пулл-реквест — ESLint, проверка типов, тесты Vitest
# (интеграционные — с PostgreSQL в сервис-контейнере) и сборка клиента.
name: CI

on:
  pull_request:

# Новый пуш в тот же PR отменяет устаревшую проверку.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Тот же образ, что в docker-compose.yml; тесты API сами создают базу life_rpg_test
      # (apps/api/src/test/global-setup.ts), учётные данные — не секрет.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_rpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_rpg"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      # Actions закреплены по SHA (тег рядом): тег можно перевесить, коммит — нет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Версия pnpm — из поля packageManager в package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @life-rpg/web build
