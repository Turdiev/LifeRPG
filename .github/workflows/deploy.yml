# tech-spec, «CI/CD»: на слияние в main — проверки, сборка клиента, миграции на Neon, затем wrangler deploy.
# Продакшен меняется только здесь (CLAUDE.md); разовая настройка облака — README, «Выпуск».
name: Deploy

on:
  push:
    branches: [main]

# Идущий деплой не прерывается: миграцию нельзя оборвать на середине. Из ожидающих GitHub оставляет
# только последний — он включает и более ранние коммиты.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Сборка — до миграций: её падение не оставит базу мигрированной без нового кода.
      # Worker отдаёт apps/web/dist как статику (apps/api/wrangler.jsonc, assets).
      - run: pnpm --filter @life-rpg/web build

      # Миграции — до нового кода: каждая должна работать и со старой версией Worker, которая
      # отвечает, пока идёт деплой. Ломающее изменение схемы — в два деплоя (README, «Если деплой упал»).
      - name: Миграции на Neon
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRIZZLE_ALLOW_REMOTE: '1'

      # Без всех секретов из secrets.required в wrangler.jsonc деплой упадёт сам.
      - name: Деплой Worker
        run: pnpm --filter @life-rpg/api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
